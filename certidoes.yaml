versao: 2.0
agente: SIGi Certidões
principios:
  - "Usar somente os portais oficiais dos órgãos emissores."
  - "Nunca contornar CAPTCHA; quando existir, solicitar intervenção humana assistida."
  - "Validar CPF/CNPJ antes de enviar e mascarar documentos no histórico."
  - "Só informar sucesso após obter um PDF real do portal, validar %PDF- e calcular SHA-256."
  - "Todos os PDFs de uma consulta ficam lado a lado em uma única pasta de Downloads."

downloads:
  diretorio_base: "CERTHUB_DOWNLOADS_DIR (vazio = pasta Downloads do sistema)"
  pasta_consulta: "{documento_digitos}_{YYYY-MM-DD}_{HH-MM-SS}"
  arquivo: "{site_id}.pdf"

portais:
  - id: compras_gov
    nome: "SICAF — Compras.gov.br"
    orgao: "Compras.gov.br"
    tipo: automacao
    modo: TOKEN
    implementado: true
    url_inicial: "https://www3.comprasnet.gov.br/sicaf-web/index.jsf"
    observacoes: ["A automação aguarda autenticação do operador e gera PDF da certidão aberta no SICAF."]

  - id: receita_cnpj
    nome: "Certidão de Pessoa Jurídica (CNPJ)"
    orgao: "Receita Federal"
    tipo: automacao
    modo: INTERNO
    implementado: true
    url_inicial: "https://servicos.receitafederal.gov.br/servico/certidoes/#/home/cnpj#"
    seletores:
      campo_cnpj: "input[placeholder*='CNPJ' i], input[name='niContribuinte']"
      botao_consultar_certidao: "button:has-text('Consultar Certidão')"
      formulario_consulta: "input[placeholder='Selecione a data'], text=Data Inicial"
      botao_consultar_periodo: "button:has-text('Consultar Certidão')"
      resultados_consulta: "datatable-body-row, table tbody tr"
      segunda_via_mais_recente: "datatable-body-row:first-child button[title='Segunda via']"
      botao_emitir_certidao: "button:has-text('Emitir Certidão')"
      botao_emitir_nova_certidao: "button:has-text('Emitir Nova Certidão')"
      resultado_emissao: "text=A certidão foi emitida com sucesso"
      download_pdf: "a[download^='Certidao-'], a:has-text('download do documento PDF da certidão')"

  - id: receita_cpf
    nome: "Certidão de Pessoa Física (CPF)"
    orgao: "Receita Federal"
    tipo: automacao
    modo: INTERNO
    implementado: true
    url_inicial: "https://servicos.receitafederal.gov.br/servico/certidoes/#/home/cpf#"
    seletores:
      campo_cpf: "input[placeholder*='CPF' i]"
      campo_data_nascimento: "input[placeholder*='Nascimento' i]"
      botao_consultar_certidao: "button:has-text('Consultar Certidão')"
      segunda_via: "table tbody tr:first-child td:last-child button"

  - id: fgts_crf
    nome: "Certificado de Regularidade do FGTS"
    orgao: "Caixa Econômica Federal"
    tipo: automacao
    modo: VISÍVEL
    implementado: true
    url_inicial: "https://consulta-crf.caixa.gov.br/consultacrf/pages/consultaEmpregador.jsf"
    seletores:
      tipo_inscricao: "select[id='mainForm:tipoEstabelecimento']"
      campo_inscricao: "input[id='mainForm:txtInscricao1']"
      campo_uf: "select[id='mainForm:uf']"
      botao_consultar: "input[id='mainForm:btnConsultar']"
      link_crf: "a:has-text('Certificado de Regularidade do FGTS - CRF')"
      botao_visualizar: "role=button[name='Visualizar']"

  - id: cndt
    nome: "Certidão Negativa de Débitos Trabalhistas"
    orgao: "Tribunal Superior do Trabalho"
    tipo: automacao
    modo: VISÍVEL/CAPTCHA
    implementado: true
    url_inicial: "https://cndt-certidao.tst.jus.br/"
    seletores:
      campo_documento: "#cpfCnpj"
      botao_emitir: "#botao-emitir"

  - id: cnj_improbidade
    nome: "Improbidade Administrativa e Inelegibilidade"
    orgao: "Conselho Nacional de Justiça"
    tipo: automacao
    modo: INTERNO
    implementado: true
    url_inicial: "https://www.cnj.jus.br/improbidade_adm/consultar_requerido.php?validar=form"
    seletores:
      campo_documento: "input[name='cpf_cnpj'], input[id='cpf_cnpj'], #num_cpf_cnpj"
      botao_pesquisar: "input[value='Pesquisar'], #btnPesquisarRequerido"
      botao_certidao_negativa: "input[value='Gerar Certidão Negativa'], #btnCertidaoNegativa"

  - id: cgu_certidoes
    nome: "Certidão Negativa Correcional"
    orgao: "Controladoria-Geral da União"
    tipo: automacao
    modo: VISÍVEL/CAPTCHA
    implementado: true
    url_inicial: "https://certidoes.cgu.gov.br/"
    seletores:
      link_emitir_publico: "a[href='/consulta-certidao']"
      radio_privado: "label.custom-control-label:has-text('Ente Privado'), input[type='radio'][value='0']"
      checkbox_cert: "input[type='checkbox'][value='8']"
      campo_documento: "#cpfCnpj"
      botao_consultar: "button:has-text('Consultar')"
      iframe_captcha: "iframe[src*='recaptcha']"
      botao_certidao: "button:has-text('Certidão')"

  - id: receita_cnpj_comprovante
    nome: "Comprovante de Inscrição e Situação Cadastral"
    orgao: "Receita Federal"
    tipo: automacao
    modo: VISÍVEL/CAPTCHA
    implementado: true
    url_inicial: "https://solucoes.receita.fazenda.gov.br/Servicos/cnpjreva/"
    seletores:
      campo_cnpj: "input[mask='AA.AAA.AAA/AAAA-AA'], input[maxlength='18']"
      iframe_hcaptcha: "iframe[title*='hCaptcha' i]"
      botao_consultar: "input[value='CONSULTAR']"

  - id: tcu_licitantes
    nome: "Certidão de Licitantes Inidôneos"
    orgao: "Tribunal de Contas da União"
    tipo: automacao
    modo: INTERNO
    implementado: true
    url_inicial: "https://certidoes.apps.tcu.gov.br/emitir-certidao-inidoneos"
    seletores:
      campo_documento: "input[type='text']"
      botao_toggle_cpf: "button[aria-label='Alternar consulta por CPF'], button:has-text('CPF')"
      botao_emitir: "button:has-text('Emitir certidão')"
      botao_baixar: "button:has-text('Baixar Certidão')"

  - id: simples_nacional
    nome: "Consulta Optantes pelo Simples Nacional"
    orgao: "Receita Federal"
    tipo: automacao
    modo: VISÍVEL
    implementado: true
    url_inicial: "https://www8.receita.fazenda.gov.br/simplesnacional/aplicacoes.aspx?id=21"
    seletores:
      campo_cnpj: "input[id*='cnpj' i]"
      botao_consultar: "button:has-text('Consultar'), input[value='Consultar']"
      marcador_resultado: "#btnMaisInfo, #GerarPDF, text=Situação Atual"
      botao_mais_info: "#btnMaisInfo, button:has-text('Mais informações')"
      botao_gerar_pdf: "#GerarPDF, button:has-text('Gerar PDF')"

fluxo_global:
  entrada: ["tipo_documento: CPF | CNPJ", "documento: string validada", "certidoes_selecionadas: lista de IDs"]
  processamento:
    - "Validar os dígitos do CPF/CNPJ; manter o documento completo apenas em memória para a automação."
    - "Criar uma pasta única {documento}_{data}_{hora} dentro de Downloads."
    - "Passar a mesma pasta para todos os fluxos da consulta."
    - "Executar somente fluxos marcados implementado=true; os demais falham como indisponíveis, sem abrir portal como substituto."
    - "Transmitir status por portal via WebSocket; aguardar CAPTCHA humano quando aplicável."
  saida:
    - "Todos os PDFs lado a lado como {site_id}.pdf na pasta única de Downloads."
    - "Validar a assinatura %PDF- e calcular SHA-256 antes de registrar sucesso."
    - "Persistir somente documento mascarado/hash e metadados sem CPF/CNPJ em claro."